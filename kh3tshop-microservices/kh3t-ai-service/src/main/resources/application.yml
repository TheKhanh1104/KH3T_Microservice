server:
  port: 8084

spring:
  application:
    name: ai-service

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

gemini:
  api:
    key: ${GEMINI_API_KEY:}
  base-url: ${GEMINI_BASE_URL:https://openrouter.ai/api/v1}

services:
  catalog:
    url: ${CATALOG_SERVICE_URL:http://localhost:8082}
  order:
    url: ${ORDER_SERVICE_URL:http://localhost:8083}
