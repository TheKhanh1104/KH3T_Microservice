stages:
  - validate
  - build
  - docker
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  FE_DIR: "kh3tshop-fe"
  MICROSERVICES_DIR: "kh3tshop-microservices"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository
    - .npm/

.rules_push_or_mr: &rules_push_or_mr
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH'

validate_frontend:
  stage: validate
  image: node:20-alpine
  script:
    - cd "$FE_DIR"
    - npm ci
    - npm run lint
  rules: *rules_push_or_mr

validate_microservices:
  stage: validate
  image: maven:3.9.9-eclipse-temurin-21
  script:
    - cd "$MICROSERVICES_DIR"
    - ./mvnw -B -DskipTests compile
  rules: *rules_push_or_mr

build_frontend:
  stage: build
  image: node:20-alpine
  script:
    - cd "$FE_DIR"
    - npm ci
    - npm run build
  artifacts:
    paths:
      - kh3tshop-fe/dist/
    expire_in: 7 days
  rules: *rules_push_or_mr

build_microservices:
  stage: build
  image: maven:3.9.9-eclipse-temurin-21
  script:
    - cd "$MICROSERVICES_DIR"
    - ./mvnw -B -DskipTests clean package
  artifacts:
    paths:
      - kh3tshop-microservices/**/target/*.jar
    expire_in: 7 days
  rules: *rules_push_or_mr

build_microservices_images:
  stage: docker
  image: docker:27.3.1
  services:
    - name: docker:27.3.1-dind
      command: ["--mtu=1460"]
  variables:
    DOCKER_HOST: tcp://docker:2375
  script:
    - docker compose version
    - docker compose -f docker-compose.yml -f docker-compose.services.yml build
  needs:
    - job: build_microservices
      artifacts: true
  rules: *rules_push_or_mr

deploy_staging:
  stage: deploy
  image: docker:27.3.1
  services:
    - name: docker:27.3.1-dind
      command: ["--mtu=1460"]
  variables:
    DOCKER_HOST: tcp://docker:2375
  script:
    - docker compose -f docker-compose.yml -f docker-compose.services.yml up -d --build --remove-orphans
  environment:
    name: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
